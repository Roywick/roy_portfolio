# Render Blueprint for the backend (server/ folder).
# Database: use a hosted PostgreSQL such as Neon or Supabase and paste its connection string below.
services:
  - type: web
    name: roywick-portfolio-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_USERNAME
        value: Roywick
